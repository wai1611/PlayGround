<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">L</div><div class="brand-name">LEGENDARY<span>FOOTBALL CAREER</span></div></div><div class="nav-label">TU CARRERA</div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="nav-label">LEGADO</div><div class="save-chip">Progreso guardado automáticamente<br><b>● Guardado local</b></div></div></aside><main><header class="topbar"><div><div class="eyebrow" id="eyebrow">TEMPORADA 01 · 2026/27</div><h1 class="page-title" id="pageTitle">Centro de carrera</h1></div><div class="top-right"><span class="top-season" id="agePill">⚽ Academia juvenil</span><div class="avatar" id="topAvatar">L</div></div></header><div class="content" id="content"></div></main></div><div id="toastRoot"></div>
<script>
const ATTRS={speed:'Velocidad',acceleration:'Aceleración',stamina:'Resistencia',strength:'Fuerza',dribbling:'Regate',control:'Control de balón',shortPass:'Pase corto',longPass:'Pase largo',vision:'Visión de juego',finishing:'Definición',shotPower:'Potencia de disparo',freeKick:'Tiros libres',penalties:'Penales',heading:'Cabeceo',tackling:'Entradas',marking:'Marcaje',positioning:'Posicionamiento',reflexes:'Reflejos'};
const TRAINING=[['speed','Velocidad explosiva','Aceleración y velocidad máxima','⚡'],['stamina','Motor incansable','Resistencia y fuerza','♧'],['dribbling','Conducción creativa','Regate y control de balón','◉'],['passing','Pases con intención','Pase corto, largo y visión','⌁'],['finishing','Instinto goleador','Definición y potencia de disparo','◎'],['setpieces','Especialista a balón parado','Tiros libres y penales','↗'],['heading','Dominio aéreo','Cabeceo y posicionamiento','↑'],['defending','Muro defensivo','Entradas, marcaje y posicionamiento','⬟'],['reflexes','Manos de acero','Reflejos y posicionamiento','✦']];
const BOOSTS=[['talent','Talento natural','Aumenta los atributos iniciales de cada nueva generación.',35],['genetics','Genética extraordinaria','Acelera el crecimiento de atributos en cada entrenamiento.',45],['discipline','Disciplina legendaria','Cada sesión otorga más experiencia y progreso.',40],['stamina','Resistencia superior','Mejora el desarrollo físico y la valoración inicial.',30],['winner','Mentalidad ganadora','Ventaja de rendimiento en partidos decisivos.',50],['prodigy','Prodigio mundial','Aumenta el techo de potencial y la valoración inicial.',65]];
const CLUBS=[{name:'Racing de Ferrol',level:1,league:'Primera Federación',badge:'🟢',country:'España'},{name:'Real Zaragoza',level:2,league:'LaLiga Hypermotion',badge:'🔵',country:'España'},{name:'Valencia CF',level:3,league:'LaLiga EA Sports',badge:'🦇',country:'España'},{name:'Real Sociedad',level:4,league:'LaLiga EA Sports',badge:'🔷',country:'España'},{name:'Manchester City',level:5,league:'Premier League',badge:'🩵',country:'Inglaterra'},{name:'Real Madrid',level:5,league:'LaLiga EA Sports',badge:'👑',country:'España'},{name:'FC Barcelona',level:5,league:'LaLiga EA Sports',badge:'🔴',country:'España'},{name:'Bayern München',level:5,league:'Bundesliga',badge:'🔴',country:'Alemania'},{name:'Inter de Milán',level:4,league:'Serie A',badge:'⚫',country:'Italia'},{name:'Paris Saint-Germain',level:4,league:'Ligue 1',badge:'🔵',country:'Francia'}];
const PAGES=[['home','⌂','Resumen'],['player','◉','Mi futbolista'],['training','↗','Entrenamiento'],['calendar','▦','Calendario'],['market','⇄','Fichajes'],['stats','▤','Estadísticas'],['trophy','♜','Palmarés'],['legacy','✦','Legado']];
const fresh=()=>({version:1,career:null,history:[],boosts:{talent:0,genetics:0,discipline:0,stamina:0,winner:0,prodigy:0},legacyPoints:0,generation:0});
let game;try{game=JSON.parse(localStorage.getItem('lfc-save'))||fresh()}catch{game=fresh()};
let page='home',selectedPosition='ST',marketOffers=[],matchTab='season';
function save(){localStorage.setItem('lfc-save',JSON.stringify(game));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>root.innerHTML='',2500)}
function avg(o){const vals=Object.values(o||{});return Math.round(vals.reduce((a,b)=>a+b,0)/Math.max(vals.length,1))}
function attrOverall(){const c=game.career;return c?avg(c.attrs):0}
function currentSeason(){return game.career?.season||1}
function navRender(){document.getElementById('nav').innerHTML=PAGES.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="nav-icon">${icon}</span><span class="nav-text">${label}</span></button>`).join('')}
function header(){const c=game.career;document.getElementById('eyebrow').textContent=c?`TEMPORADA ${String(c.season).padStart(2,'0')} · ${2026+c.season-1}/${String(2027+c.season-1).slice(-2)}`:'EL COMIENZO DE UNA LEYENDA';document.getElementById('agePill').textContent=c?`⚽ ${c.age} años · ${c.position}`:'⚽ Nueva carrera';document.getElementById('topAvatar').textContent=c?c.name.slice(0,1).toUpperCase():'L';document.getElementById('pageTitle').textContent=({home:'Centro de carrera',player:'Mi futbolista',training:'Centro de entrenamiento',calendar:'Calendario de temporada',market:'Mercado de fichajes',stats:'Estadísticas',trophy:'Palmarés',legacy:'Salón de leyendas'})[page]||''}
function go(id){page=id;render()}
function render(){navRender();header();const c=game.career;document.getElementById('content').innerHTML=page==='home'?homeView(c):page==='player'?playerView(c):page==='training'?trainingView(c):page==='calendar'?calendarView(c):page==='market'?marketView(c):page==='stats'?statsView(c):page==='trophy'?trophyView(c):legacyView();}
function statCard(label,value,sub,icon){return `<div class="card stat-card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`}
function meter(label,value){return `<div class="meter-row"><span>${label}</span><div class="bar"><i style="width:${value}%"></i></div><b>${value}</b></div>`}
function emptyCareer(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">TU HISTORIA EMPIEZA AQUÍ</div><h2>De promesa juvenil<br>a leyenda mundial.</h2><p>Crea a tu futbolista, elige tu camino y escribe una carrera que pasará a la historia. Cada generación deja un legado para la siguiente.</p><button class="btn btn-primary" onclick="go('player')">Crear futbolista <span>→</span></button></div></div><div class="section-head"><div><h2 class="section-title">El camino a la gloria</h2><div class="section-note">Una carrera. Veinte temporadas. Un legado para siempre.</div></div></div><div class="grid grid-3">${[['01','Desarrolla tu talento','Entrena sin límites y haz crecer cada atributo.'],['02','Brilla en el campo','Juega partidos, gana títulos y atrae a los grandes.'],['03','Deja tu legado','Invierte tus puntos para impulsar a la próxima generación.']].map(([n,t,d])=>`<div class="card"><div class="eyebrow">FASE ${n}</div><h3 style="font:600 14px var(--display);margin:12px 0 5px">${t}</h3><div class="small muted">${d}</div></div>`).join('')}</div>`}
function homeView(c){if(!c)return emptyCareer();const o=attrOverall(),next=c.matchesPlayed<3?`Próximo partido · Jornada ${c.matchesPlayed+1}`:'Temporada completada';const upcoming=c.matchesPlayed<3?c.schedule[c.matchesPlayed]:null;return `<div class="hero"><div class="hero-copy"><div class="eyebrow">${esc(c.club)} · ${esc(c.league)}</div><h2>Tu leyenda está<br>en construcción, ${esc(c.name.split(' ')[0])}.</h2><p>${c.age} años · ${esc(c.positionName)} · ${esc(c.nationality)}. Una carrera entera por delante. El próximo capítulo empieza en el campo.</p><button class="btn btn-primary" onclick="go('calendar')">${upcoming?'Preparar partido':'Ver temporada'} <span>→</span></button></div></div><div class="section-head"><div><h2 class="section-title">Panel de temporada</h2><div class="section-note">Tu progreso, de un vistazo.</div></div><span class="tag lime">● EN CARRERA</span></div><div class="grid grid-4">${statCard('VALORACIÓN',o,'Media de atributos','✦')}${statCard('PARTIDOS',c.seasonStats.apps,`${c.matchesPlayed}/3 jornadas disputadas`,'◷')}${statCard('GOLES',c.seasonStats.goals,'Esta temporada','◎')}${statCard('SALARIO',`€${c.salary}k`,'por temporada','↗')}</div><div class="section-head"><div><h2 class="section-title">Tu futbolista</h2><div class="section-note">Condiciones perfectas para rendir.</div></div><button class="btn btn-quiet" onclick="go('player')">Ver perfil →</button></div><div class="grid grid-2"><div class="card player-card"><div class="player-portrait">${posEmoji(c.position)}</div><div class="player-data"><h3>${esc(c.name)}</h3><p>${esc(c.club)} · ${c.age} años</p><div style="display:flex;gap:6px;margin-top:9px"><span class="tag lime">${c.position}</span><span class="tag">${esc(c.nationality)}</span></div></div><div class="player-rating"><div class="rating-num">${o}</div><div class="rating-label">MEDIA</div></div></div><div class="card"><div class="row"><b style="font:600 13px var(--display)">Estado de ánimo</b><span class="tag lime">100% · PERFECTO</span></div><div class="divider"></div><div class="row small"><span class="muted">Energía</span><b>100%</b></div><div class="bar green-bar" style="margin:7px 0 12px"><i style="width:100%"></i></div><div class="row small"><span class="muted">Actitud y motivación</span><b>100%</b></div><div class="bar" style="margin-top:7px"><i style="width:100%"></i></div></div></div><div class="section-head"><div><h2 class="section-title">Próximo encuentro</h2><div class="section-note">La temporada se juega partido a partido.</div></div><button class="btn btn-quiet" onclick="go('calendar')">Calendario →</button></div>${upcoming?matchPreview(upcoming,c):`<div class="notice">Has completado las tres jornadas. <button class="btn btn-secondary" onclick="finishSeason()" style="margin-left:8px">Cerrar temporada</button></div>`}`}
function posEmoji(p){return ({'POR':'🧤','DFC':'🛡️','LD':'⚡','LI':'⚡','MCD':'🧠','MC':'🎯','MCO':'✨','ED':'💨','EI':'💨','ST':'⚽'})[p]||'⚽'}
function matchPreview(m,c){return `<div class="card match-card"><div class="match-team"><div class="club-badge">${CLUBS.find(x=>x.name===c.club)?.badge||'⚽'}</div><div><b>${esc(c.club)}</b><small>Local · ${c.league}</small></div></div><div class="match-info"><strong>${m.type}</strong><small>${m.date} · ${m.round}</small></div><div class="match-team"><div><b>${esc(m.opponent)}</b><small>Visitante</small></div><div class="club-badge">${m.badge}</div></div></div>`}
function startForm(){return `<div class="section-head" style="margin-top:0"><div><h2 class="section-title">Crea a tu próxima leyenda</h2><div class="section-note">Empieza con 16 años. Tu primera decisión define el camino.</div></div></div><div class="grid grid-2"><div class="card"><div class="eyebrow">IDENTIDAD</div><div class="form-grid" style="margin-top:16px"><div class="field" style="grid-column:1/-1"><label>Nombre del futbolista</label><input id="playerName" maxlength="28" placeholder="Ej. Alex Martín" value=""></div><div class="field"><label>Nacionalidad</label><select id="nationality"><option>España</option><option>Argentina</option><option>Brasil</option><option>Francia</option><option>Inglaterra</option><option>Portugal</option><option>México</option><option>Colombia</option><option>Japón</option><option>Marruecos</option></select></div><div class="field"><label>Club inicial</label><select id="clubStart">${CLUBS.slice(0,4).map(x=>`<option value="${x.name}">${x.badge} ${x.name} · Nivel ${x.level}</option>`).join('')}</select></div></div><div class="divider"></div><div class="field"><label>Elige tu posición principal</label><div class="position-choice" id="posChoice">${[['POR','Portero'],['DFC','Central'],['LD','Lateral'],['MCD','Pivote'],['MC','Mediocentro'],['MCO','Mediapunta'],['ED','Extremo'],['ST','Delantero']].map(([id,label])=>`<button class="${selectedPosition===id?'selected':''}" onclick="choosePos('${id}')">${id}<br><span style="font-size:9px;opacity:.7">${label}</span></button>`).join('')}</div></div><div class="notice" style="margin-top:15px">✦ Empiezas a los <strong>16 años</strong>. Tus boosts de legado se aplicarán automáticamente.</div><button class="btn btn-primary" onclick="createCareer()" style="width:100%;margin-top:15px">Comenzar mi carrera →</button></div><div class="card"><div class="eyebrow">GENERACIONES ANTERIORES</div><h3 style="font:600 16px var(--display);margin:10px 0">Legado acumulado</h3><div style="font:700 38px var(--display);color:var(--lime)">${game.legacyPoints} <span style="font-size:12px;color:#a6b5aa">LP disponibles</span></div><p class="small muted">Los puntos invertidos en mejoras permanentes fortalecen a cada nueva generación. Tu historial y tus boosts se conservan en este dispositivo.</p><div class="divider"></div><div class="row small"><span class="muted">Generaciones completadas</span><b>${game.history.length}</b></div><div class="row small" style="margin-top:11px"><span class="muted">Mejor valoración histórica</span><b>${game.history.length?Math.max(...game.history.map(h=>h.bestRating)):0}</b></div><button class="btn btn-secondary" onclick="go('legacy')" style="width:100%;margin-top:18px">Ver legado y mejoras →</button></div></div>`}
function createCareer(){const name=document.getElementById('playerName').value.trim();if(name.length<2){notify('Escribe un nombre de al menos 2 caracteres');return}const clubName=document.getElementById('clubStart').value,club=CLUBS.find(x=>x.name===clubName);const boostStart=game.boosts.talent*2+game.boosts.stamina+game.boosts.prodigy*2;const base=39+Math.min(boostStart,12);let attrs={};Object.keys(ATTRS).forEach(k=>attrs[k]=Math.min(100,base+Math.floor(Math.random()*9)));const position=selectedPosition;const c={name,nationality:document.getElementById('nationality').value,position,positionName:({POR:'Portero',DFC:'Defensa central',LD:'Lateral derecho',LI:'Lateral izquierdo',MCD:'Mediocentro defensivo',MC:'Mediocentro',MCO:'Mediapunta',ED:'Extremo derecho',EI:'Extremo izquierdo',ST:'Delantero'})[position]||'Delantero',age:16,club:club.name,league:club.league,clubLevel:club.level,season:1,year:2026,salary:10,matchesPlayed:0,experience:0,attrs,clubs:[club.name],schedule:makeSchedule(1,club.name),seasonStats:{apps:0,goals:0,assists:0,minutes:0,ratingTotal:0},careerStats:{apps:0,goals:0,assists:0,titles:[],awards:[],bestRating:avg(attrs)},seasonHistory:[],potential:Math.min(100,85+game.boosts.prodigy*2),contractYears:3};game.career=c;game.generation++;save();notify(`¡La carrera de ${name} comienza!`);page='home';render()}
function choosePos(id){selectedPosition=id;render()}
function playerView(c){if(!c)return startForm();const groups=[['FÍSICO',['speed','acceleration','stamina','strength']],['TÉCNICA',['dribbling','control','shortPass','longPass','vision','finishing','shotPower','freeKick','penalties','heading']],['DEFENSA Y PORTERÍA',['tackling','marking','positioning','reflexes']]];return `<div class="grid grid-2"><div class="card player-card"><div class="player-portrait">${posEmoji(c.position)}</div><div class="player-data"><div class="eyebrow">${esc(c.nationality)} · ${c.age} AÑOS</div><h3 style="margin-top:6px">${esc(c.name)}</h3><p>${esc(c.positionName)} · ${esc(c.club)}</p><div style="display:flex;gap:6px;margin-top:10px"><span class="tag lime">${c.position}</span><span class="tag">Potencial ${c.potential}</span></div></div><div class="player-rating"><div class="rating-num">${attrOverall()}</div><div class="rating-label">MEDIA</div></div></div><div class="card"><div class="row"><b style="font:600 14px var(--display)">Estado de carrera</b><span class="tag lime">ACTIVO</span></div><div class="divider"></div><div class="row small"><span class="muted">Energía</span><b>100%</b></div><div class="bar green-bar" style="margin:7px 0 13px"><i style="width:100%"></i></div><div class="row small"><span class="muted">Actitud y motivación</span><b>100%</b></div><div class="bar" style="margin:7px 0 14px"><i style="width:100%"></i></div><div class="row small"><span class="muted">Experiencia acumulada</span><b>${c.experience} XP</b></div><div class="bar orange-bar" style="margin:7px 0 0"><i style="width:${c.experience%100}%"></i></div></div></div><div class="section-head"><div><h2 class="section-title">Panel de atributos</h2><div class="section-note">Media general ${attrOverall()} · máximo 100 · crecimiento permanente.</div></div><button class="btn btn-secondary" onclick="go('training')">Entrenar →</button></div>${groups.map(([group,keys])=>`<div class="card" style="margin-bottom:12px"><div class="eyebrow" style="margin-bottom:14px">${group}</div><div class="grid grid-2">${keys.map(k=>meter(ATTRS[k],c.attrs[k])).join('')}</div></div>`).join('')}<div class="section-head"><div><h2 class="section-title">Trayectoria de clubes</h2><div class="section-note">Equipos que han sido parte de la historia.</div></div></div><div class="card"><div style="display:flex;flex-wrap:wrap;gap:8px">${c.clubs.map((x,i)=>`<span class="tag ${x===c.club?'lime':''}">${i+1}. ${esc(x)}</span>`).join('')}</div></div>`}
function trainingView(c){if(!c)return `<div class="empty">Primero crea tu futbolista.<br><button class="btn btn-primary" onclick="go('player')" style="margin-top:13px">Crear futbolista</button></div>`;return `<div class="notice"><strong>Entrena sin límites.</strong> La energía y la motivación permanecen siempre al 100%. Cada sesión suma experiencia y mejora tus atributos. No hay costes ni esperas.</div><div class="grid grid-3" style="margin-top:15px">${TRAINING.map(([key,title,desc,icon])=>`<div class="card training-card"><div class="train-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><div class="train-footer"><span class="train-gain">+${gainPreview()} XP · +atributo</span><button class="btn btn-secondary" onclick="train('${key}')">Entrenar</button></div></div>`).join('')}</div><div class="section-head"><div><h2 class="section-title">Progreso de desarrollo</h2><div class="section-note">Entrenamientos realizados: ${c.trainingCount||0} · Nivel de desarrollo ilimitado.</div></div><span class="tag">${c.experience} XP</span></div><div class="card"><div class="row"><span class="small muted">Valoración actual</span><b>${attrOverall()} / 100</b></div><div class="bar" style="margin-top:10px"><i style="width:${attrOverall()}%"></i></div><div class="footer-hint">El crecimiento se vuelve más gradual al acercarte al máximo. Disciplina y genética aumentan la progresión.</div></div>`}
function gainPreview(){return 10+game.boosts.discipline*4}
function train(key){const c=game.career;if(!c)return;const mapping={speed:['speed','acceleration'],stamina:['stamina','strength'],dribbling:['dribbling','control'],passing:['shortPass','longPass','vision'],finishing:['finishing','shotPower'],setpieces:['freeKick','penalties'],heading:['heading','positioning'],defending:['tackling','marking','positioning'],reflexes:['reflexes','positioning']};const xp=10+game.boosts.discipline*4;c.experience+=xp;c.trainingCount=(c.trainingCount||0)+1;let gains=0;for(const attr of mapping[key]||[]){const old=c.attrs[attr];const growthFactor=1+game.boosts.genetics*.18;const chance=old<65?1:old<82?.75:old<95?.45:.2;if(Math.random()<chance){c.attrs[attr]=Math.min(100,old+Math.max(1,Math.floor(growthFactor)));if(c.attrs[attr]>old)gains++}}c.careerStats.bestRating=Math.max(c.careerStats.bestRating,avg(c.attrs));save();render();notify(`Sesión completada · +${xp} XP · ${gains?`+${gains} mejora${gains>1?'s':''}`:'experiencia ganada'}`)}
function makeSchedule(season,clubName=game.career?.club){const opponents=CLUBS.filter(x=>x.name!==clubName);const shuffled=[...opponents].sort(()=>Math.random()-.5).slice(0,3);const year=2026+season-1;return shuffled.map((x,i)=>({opponent:x.name,badge:x.badge,type:i===1?'Copa nacional':'Liga',round:i===1?'Ronda de copa':`Jornada ${i===1?10:i+1}`,date:[`Agosto ${year}`,`Octubre ${year}`,`Mayo ${year+1}`][i]}))}
function calendarView(c){if(!c)return `<div class="empty">Tu calendario te espera. Crea un futbolista para empezar.<br><button class="btn btn-primary" onclick="go('player')" style="margin-top:13px">Crear futbolista</button></div>`;return `<div class="row" style="margin-bottom:14px"><div><div class="eyebrow">${esc(c.league)}</div><h2 class="section-title" style="margin-top:5px">Temporada ${c.season} · ${c.year}/${String(c.year+1).slice(-2)}</h2></div><span class="tag lime">${c.matchesPlayed}/3 PARTIDOS</span></div><div class="stack">${c.schedule.map((m,i)=>`<div>${matchPreview(m,c)}<div class="row" style="margin:8px 8px 0"><span class="small muted">${i<c.matchesPlayed?`Resultado: ${m.result} · ${m.playerRating}/10`:'Partido pendiente'}</span>${i===c.matchesPlayed?`<button class="btn btn-primary" onclick="playMatch()">Jugar partido →</button>`:i<c.matchesPlayed?'<span class="tag lime">JUGADO</span>':''}</div></div>`).join('')}</div>${c.matchesPlayed===3?`<div class="card" style="margin-top:16px"><div class="row"><div><b style="font:600 14px var(--display)">Fin de temporada</b><div class="small muted" style="margin-top:4px">Cierra el año, revisa tus logros y avanza tu carrera.</div></div><button class="btn btn-primary" onclick="finishSeason()">Cerrar temporada →</button></div></div>`:''}<div class="section-head"><div><h2 class="section-title">Temporada en números</h2><div class="section-note">Rendimiento acumulado hasta ahora.</div></div></div><div class="grid grid-4">${statCard('MINUTOS',c.seasonStats.minutes,'En competición','◷')}${statCard('GOLES',c.seasonStats.goals,'Aportación ofensiva','◎')}${statCard('ASISTENCIAS',c.seasonStats.assists,'Pases de gol','⌁')}${statCard('VALORACIÓN MEDIA',c.seasonStats.apps?(c.seasonStats.ratingTotal/c.seasonStats.apps).toFixed(1):'—','Por partido','✦')}</div>`}
function calcMatch(c,opponent){const club=CLUBS.find(x=>x.name===c.club)||CLUBS[0],opp=CLUBS.find(x=>x.name===opponent)||CLUBS[1];const level=attrOverall(),positionFactor=['ST','ED','EI','MCO'].includes(c.position)?(c.attrs.finishing+c.attrs.dribbling)/2:(c.position==='POR'?c.attrs.reflexes:(c.attrs.shortPass+c.attrs.positioning)/2);const skill=(level*.55+positionFactor*.45)+(game.boosts.winner*1.5);const strength=club.level*10+skill*.48+Math.random()*18,oppStrength=opp.level*12+Math.random()*23;let gf=Math.max(0,Math.round((strength-oppStrength+18)/22+Math.random()*2)),ga=Math.max(0,Math.round((oppStrength-strength+18)/23+Math.random()*2));const performance=Math.min(10,Math.max(5.5,6.1+(skill-45)/17+(gf>ga?.5:gf<ga?-.1:.2)+Math.random()*1.3));let goals=0,assists=0;if(['ST','ED','EI','MCO'].includes(c.position)){goals=Math.min(gf,Math.floor(Math.random()*(Math.max(1,c.attrs.finishing/20))));assists=Math.min(Math.max(0,gf-goals),Math.random()<.42?1:0)}else{goals=gf&&Math.random()<.18?1:0;assists=gf&&Math.random()<.28?1:0}if(c.position==='POR')goals=0;return {gf,ga,performance,goals,assists,minutes:Math.random()<.2?Math.floor(60+Math.random()*30):90}}
function playMatch(){const c=game.career;if(!c||c.matchesPlayed>=3)return;const m=c.schedule[c.matchesPlayed];const result=calcMatch(c,m.opponent);m.result=`${result.gf}-${result.ga}`;m.playerRating=result.performance.toFixed(1);m.goals=result.goals;m.assists=result.assists;c.matchesPlayed++;c.seasonStats.apps++;c.seasonStats.goals+=result.goals;c.seasonStats.assists+=result.assists;c.seasonStats.minutes+=result.minutes;c.seasonStats.ratingTotal+=result.performance;c.careerStats.apps++;c.careerStats.goals+=result.goals;c.careerStats.assists+=result.assists;c.careerStats.bestRating=Math.max(c.careerStats.bestRating,attrOverall());c.experience+=8+Math.round(result.performance);if(result.gf>result.ga)c.wins=(c.wins||0)+1;save();render();notify(`Final ${result.gf}-${result.ga} · Nota ${result.performance.toFixed(1)}${result.goals?' · ⚽ '+result.goals+' gol':''}${result.assists?' · asistencia':''}`)}
function finishSeason(){const c=game.career;if(!c||c.matchesPlayed<3)return;const avgRating=c.seasonStats.ratingTotal/(c.seasonStats.apps||1);const wins=c.wins||0;let title=null,award=null;if(wins>=2){title=wins===3?'Liga nacional':'Copa nacional';c.careerStats.titles.push({name:title,season:c.season,club:c.club});notify(`¡Campeón! Has ganado ${title}.`)}if(avgRating>=8){award='Jugador de la temporada';c.careerStats.awards.push({name:award,season:c.season});}c.seasonHistory.push({season:c.season,year:c.year,club:c.club,apps:c.seasonStats.apps,goals:c.seasonStats.goals,assists:c.seasonStats.assists,avgRating:+avgRating.toFixed(1),title,award});if(c.age>=35||c.season>=20){retireCareer('career-end');return}c.age++;c.season++;c.year++;c.contractYears=Math.max(0,c.contractYears-1);c.matchesPlayed=0;c.schedule=makeSchedule(c.season);c.seasonStats={apps:0,goals:0,assists:0,minutes:0,ratingTotal:0};c.wins=0;if(c.contractYears===0){c.contractYears=2;c.salary=Math.round(c.salary*1.15)}save();page='home';render();if(!title)notify(`Temporada ${c.season-1} finalizada · ¡A por la siguiente!`)}
function marketView(c){if(!c)return `<div class="empty">El mercado de fichajes se abrirá cuando comience tu carrera.</div>`;const offers=generateOffers(c);return `<div class="hero" style="min-height:145px"><div class="hero-copy"><div class="eyebrow">MERCADO DE FICHAJES</div><h2 style="font-size:23px;margin-top:6px">Tu próximo gran salto.</h2><p style="margin:0">Las ofertas dependen de tu rendimiento, valoración y temporadas jugadas. Cambiar de club actualiza tu liga y tu salario.</p></div></div><div class="section-head"><div><h2 class="section-title">Clubes interesados</h2><div class="section-note">Tu club actual: ${esc(c.club)} · Valoración ${attrOverall()}</div></div><button class="btn btn-quiet" onclick="render()">↻ Actualizar ofertas</button></div><div class="stack">${offers.length?offers.map(o=>`<div class="card offer-card"><div class="club-badge">${o.badge}</div><div class="offer-main"><h3>${esc(o.name)}</h3><div class="offer-meta"><span>${esc(o.league)}</span><span>Prestigio ${o.level}/5</span><span>Contrato 3 años</span></div></div><div><div class="contract-value">€${o.salary}k</div><div class="small muted">por temporada</div></div><button class="btn btn-primary" onclick="acceptOffer('${o.name}')">Firmar contrato</button></div>`).join(''):'<div class="card empty">Aún no hay ofertas. Sube tu valoración o juega partidos para llamar la atención de otros clubes.</div>'}</div><div class="section-head"><div><h2 class="section-title">Negociar contrato actual</h2><div class="section-note">Pide una mejora salarial a tu equipo.</div></div></div><div class="card row"><div><b style="font:600 13px var(--display)">${esc(c.club)}</b><div class="small muted" style="margin-top:4px">Salario actual: €${c.salary}k · ${c.contractYears} años restantes</div></div><button class="btn btn-secondary" onclick="negotiate()">Negociar salario</button></div><div class="footer-hint">Puedes fichar en cualquier momento. Las ofertas más prestigiosas requieren una valoración alta o una reputación consolidada.</div>`}
function generateOffers(c){let candidates=CLUBS.filter(x=>x.name!==c.club&&x.level<=Math.min(5,Math.floor((attrOverall()-30)/9)+1));if(c.season>=3&&attrOverall()>59)candidates=CLUBS.filter(x=>x.name!==c.club&&x.level<=Math.min(5,Math.floor((attrOverall()-25)/9)+1));return candidates.sort((a,b)=>a.level-b.level).slice(-3).map(x=>({...x,salary:Math.max(c.salary+2,Math.round((x.level*8+attrOverall()*.6)*(1+c.season*.06)))}))}
function acceptOffer(name){const c=game.career,club=CLUBS.find(x=>x.name===name);if(!c||!club)return;const offer=generateOffers(c).find(x=>x.name===name);if(!offer){notify('Esta oferta ya no está disponible');return}c.club=club.name;c.league=club.league;c.clubLevel=club.level;c.salary=offer.salary;c.contractYears=3;if(!c.clubs.includes(club.name))c.clubs.push(club.name);save();render();notify(`¡Contrato firmado con ${club.name}! Salario €${offer.salary}k`)}
function negotiate(){const c=game.career;if(!c)return;const expected=Math.round(c.clubLevel*7+attrOverall()*.35);if(attrOverall()<48&&c.season<2){notify('Tu representante recomienda ganar experiencia antes de negociar.');return}c.salary=Math.max(c.salary+1,expected);c.contractYears=Math.max(c.contractYears,2);save();render();notify(`¡Negociación exitosa! Nuevo salario: €${c.salary}k / temporada`)}
function statsView(c){if(!c)return `<div class="empty">Aún no hay estadísticas de carrera.<br>Tu historia empieza con un futbolista nuevo.</div>`;return `<div class="section-head" style="margin-top:0"><div><h2 class="section-title">Rendimiento de ${esc(c.name)}</h2><div class="section-note">Desglose de esta temporada y de toda tu carrera profesional.</div></div></div><div class="grid grid-4">${statCard('PARTIDOS',c.careerStats.apps,'En toda la carrera','◷')}${statCard('GOLES',c.careerStats.goals,'En toda la carrera','◎')}${statCard('ASISTENCIAS',c.careerStats.assists,'En toda la carrera','⌁')}${statCard('MEJOR MEDIA',c.careerStats.bestRating,'Valoración máxima','✦')}</div><div class="section-head"><div><h2 class="section-title">Historial por temporada</h2><div class="section-note">Los datos completos se archivan al cierre de cada temporada.</div></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>TEMPORADA</th><th>CLUB</th><th>PJ</th><th>G</th><th>AS</th><th>MEDIA</th><th>HITOS</th></tr></thead><tbody>${[...c.seasonHistory,...(c.matchesPlayed||c.seasonStats.apps?[{season:c.season,year:c.year,club:c.club,apps:c.seasonStats.apps,goals:c.seasonStats.goals,assists:c.seasonStats.assists,avgRating:c.seasonStats.apps?(c.seasonStats.ratingTotal/c.seasonStats.apps).toFixed(1):'—',title:null,award:null,live:true}]:[])].map(h=>`<tr><td>T${String(h.season).padStart(2,'0')} · ${h.year}${h.live?'*':''}</td><td>${esc(h.club)}</td><td>${h.apps}</td><td>${h.goals}</td><td>${h.assists}</td><td>${h.avgRating}</td><td>${h.title?`🏆 ${esc(h.title)}`:''}${h.award?` ✦ ${esc(h.award)}`:''}${!h.title&&!h.award?'—':''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Juega tu primer partido para comenzar tu registro.</td></tr>'}</tbody></table><div class="footer-hint">* Temporada actual en curso.</div></div><div class="section-head"><div><h2 class="section-title">Producción por partido</h2><div class="section-note">Tu contribución directa al marcador.</div></div></div><div class="grid grid-2"><div class="card"><div class="row"><span class="muted small">Goles por partido</span><b>${c.careerStats.apps?(c.careerStats.goals/c.careerStats.apps).toFixed(2):'0.00'}</b></div><div class="divider"></div><div class="row"><span class="muted small">Asistencias por partido</span><b>${c.careerStats.apps?(c.careerStats.assists/c.careerStats.apps).toFixed(2):'0.00'}</b></div></div><div class="card"><div class="row"><span class="muted small">Títulos colectivos</span><b>${c.careerStats.titles.length}</b></div><div class="divider"></div><div class="row"><span class="muted small">Premios individuales</span><b>${c.careerStats.awards.length}</b></div></div></div>`}
function trophyView(c){const titles=c?.careerStats.titles||[],awards=c?.careerStats.awards||[];return `<div class="hero" style="min-height:145px"><div class="hero-copy"><div class="eyebrow">PALMARÉS</div><h2 style="font-size:23px;margin-top:6px">Los momentos que quedan.</h2><p style="margin:0">Gana partidos, destaca individualmente y lleva a tus clubes a la gloria.</p></div></div><div class="grid grid-2" style="margin-top:15px"><div class="card"><div class="row"><h2 class="section-title">🏆 Títulos colectivos</h2><span class="tag lime">${titles.length}</span></div>${titles.length?`<div class="stack" style="margin-top:15px">${titles.map(t=>`<div class="row"><span>${esc(t.name)}</span><span class="small muted">T${t.season} · ${esc(t.club)}</span></div>`).join('')}</div>`:'<div class="empty">Los trofeos se ganan consiguiendo al menos dos victorias en la temporada.</div>'}</div><div class="card"><div class="row"><h2 class="section-title">✦ Premios individuales</h2><span class="tag orange">${awards.length}</span></div>${awards.length?`<div class="stack" style="margin-top:15px">${awards.map(a=>`<div class="row"><span>${esc(a.name)}</span><span class="small muted">Temporada ${a.season}</span></div>`).join('')}</div>`:'<div class="empty">Promedia 8.0 o más para ser Jugador de la temporada.</div>'}</div></div><div class="section-head"><div><h2 class="section-title">Colección de la generación</h2><div class="section-note">Tu vitrina personal.</div></div></div><div class="card"><div style="font-size:26px">${titles.length?'🏆'.repeat(Math.min(10,titles.length)):'—'} ${awards.length?'✦'.repeat(Math.min(10,awards.length)):''}</div><p class="small muted">${titles.length+awards.length?`${titles.length} título(s) · ${awards.length} premio(s) conseguidos.`:'Todavía no hay trofeos. Cada temporada es una nueva oportunidad.'}</p></div>`}
function legacyView(){const c=game.career;return `<div class="hero" style="min-height:170px"><div class="hero-copy"><div class="eyebrow">EL LEGADO TRASCIENDE GENERACIONES</div><h2 style="font-size:26px;margin-top:7px">Una leyenda nunca<br>juega sola.</h2><p>Tu trayectoria se convierte en puntos de legado. Invierte en mejoras permanentes y cada nuevo futbolista heredará parte de tu grandeza.</p></div><div style="position:relative;z-index:1;margin-left:auto;text-align:center;padding:0 28px"><div style="font:700 40px var(--display);color:var(--lime)">${game.legacyPoints}</div><div class="eyebrow">PUNTOS LP</div></div></div><div class="section-head"><div><h2 class="section-title">Mejoras permanentes</h2><div class="section-note">Se acumulan y aplican en todas tus futuras carreras.</div></div><span class="tag lime">GENERACIÓN ${game.generation}</span></div><div class="grid grid-3">${BOOSTS.map(([id,name,desc,price])=>{const level=game.boosts[id]||0,cost=price*(level+1);return `<div class="card boost-card"><div class="row"><div class="train-icon">${({talent:'✦',genetics:'⌁',discipline:'◈',stamina:'♧',winner:'♜',prodigy:'☄'})[id]}</div><span class="tag">Nv. ${level}</span></div><h3>${name}</h3><p>${desc}</p><div class="boost-level">${Array.from({length:5},(_,i)=>`<i class="${i<Math.min(level,5)?'on':''}"></i>`).join('')}</div><div class="row"><span class="boost-price">${cost} LP · ${level>=5?'Nivel máximo':'Siguiente nivel'}</span><button class="btn ${game.legacyPoints>=cost&&level<5?'btn-primary':'btn-secondary'}" ${game.legacyPoints<cost||level>=5?'disabled':''} onclick="buyBoost('${id}')">${level>=5?'Máximo':'Mejorar'}</button></div></div>`}).join('')}</div><div class="section-head"><div><h2 class="section-title">Historial de leyendas</h2><div class="section-note">Todas las generaciones se conservan permanentemente en este dispositivo.</div></div>${c?`<button class="btn btn-danger" onclick="retireCareer('voluntary')">Retirar futbolista</button>`:''}</div>${game.history.length?`<div class="stack">${[...game.history].reverse().map(h=>`<div class="card"><div class="row"><div class="player-data"><h3>${esc(h.name)}</h3><p>${esc(h.nationality)} · ${h.debutAge}–${h.retirementAge} años · ${h.seasons} temporadas</p></div><span class="tag lime">${h.legacyPoints} LP</span></div><div class="grid grid-4" style="margin-top:15px"><div><div class="muted small">CLUBES</div><b class="small">${h.clubs.map(esc).join(' · ')}</b></div><div><div class="muted small">PARTIDOS</div><b>${h.apps}</b></div><div><div class="muted small">G / AS</div><b>${h.goals} / ${h.assists}</b></div><div><div class="muted small">TÍTULOS · PREMIOS</div><b>${h.titles.length} · ${h.awards.length}</b></div></div><div class="footer-hint">Valoración máxima ${h.bestRating} · Retiro: ${esc(h.reason)}</div></div>`).join('')}</div>`:'<div class="card empty"><div class="empty-icon">✦</div>Aún no hay generaciones retiradas.<br>Completa tu carrera y aquí aparecerán tus leyendas.</div>'}<div class="section-head"><div><h2 class="section-title">Generación actual</h2><div class="section-note">El capítulo que está escribiéndose.</div></div></div><div class="card row"><div><b>${c?`${esc(c.name)} · ${c.age} años`: 'Sin carrera activa'}</b><div class="small muted" style="margin-top:4px">${c?`${esc(c.club)} · Temporada ${c.season} de 20`:'Crea un futbolista para comenzar una nueva generación.'}</div></div>${c?'<span class="tag lime">ACTIVA</span>':`<button class="btn btn-primary" onclick="go('player')">Crear futbolista</button>`}</div>`}
function buyBoost(id){const boost=BOOSTS.find(x=>x[0]===id);if(!boost)return;const level=game.boosts[id]||0,cost=boost[3]*(level+1);if(level>=5){notify('Esta mejora ya alcanzó el nivel máximo.');return}if(game.legacyPoints<cost){notify(`Necesitas ${cost} LP para esta mejora.`);return}game.legacyPoints-=cost;game.boosts[id]=level+1;save();render();notify(`${boost[1]} mejorado al nivel ${level+1}. ¡Se aplicará a las nuevas generaciones!`)}
function retireCareer(reason){const c=game.career;if(!c)return;const seasons=Math.max(1,c.season-1+(c.matchesPlayed>0?1:0)),stats=c.careerStats;const points=Math.max(8,Math.round(6+seasons*2+stats.apps/4+stats.goals/2+stats.assists/3+stats.titles.length*5+stats.awards.length*3+stats.bestRating*.35));const record={name:c.name,nationality:c.nationality,debutAge:16,retirementAge:c.age,seasons,clubs:[...c.clubs],apps:stats.apps,goals:stats.goals,assists:stats.assists,titles:[...stats.titles],awards:[...stats.awards],bestRating:stats.bestRating,legacyPoints:points,reason:reason==='career-end'?'Fin de carrera':'Retiro voluntario',retiredAt:new Date().toISOString()};game.history.push(record);game.legacyPoints+=points;game.career=null;save();page='legacy';render();notify(`¡${record.name} se retira como leyenda! +${points} puntos de legado`)}
function init(){navRender();render()}
init();
</script>
</body>
</html>
